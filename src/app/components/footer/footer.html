<footer class="border-t border-slate-200 bg-white p-6 mt-10">

    <div class="flex flex-col gap-5 max-w-4xl mx-auto">

        <div>
            <h2 class="text-2xl font-bold text-slate-800">
                {{ title() | uppercase }}
            </h2>

            <p class="text-slate-500 mt-1">
                {{ message() | lowercase }}
            </p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">

            <div class="border border-slate-200 rounded-md p-4 bg-slate-50">
                <span class="text-sm text-slate-500">
                    Fecha
                </span>

                <p class="font-medium text-slate-800 mt-1">
                    {{ today() | date:'fullDate' }}
                </p>
            </div>

            <div class="border border-slate-200 rounded-md p-4 bg-slate-50">
                <span class="text-sm text-slate-500">
                    Total
                </span>

                <p class="font-medium text-slate-800 mt-1">
                    {{ price() | currency }}
                </p>
            </div>

            <div class="border border-slate-200 rounded-md p-4 bg-slate-50">
                <span class="text-sm text-slate-500">
                    Progreso
                </span>

                <p class="font-medium text-slate-800 mt-1">
                    {{ percent() | percent }}
                </p>
            </div>

        </div>

    </div>

</footer>
