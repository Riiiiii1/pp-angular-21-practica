<footer class="footer sm:footer-horizontal mt-10 border-t border-base-200 bg-base-100 p-10 text-base-content shadow-sm">

  <!-- SECCIÓN 1: INFO PRINCIPAL -->
  <nav>
    <h6 class="footer-title">
      {{ title() | uppercase }}
    </h6>

    <p class="text-sm opacity-80">
      {{ message() | lowercase }}
    </p>
  </nav>

  <!-- SECCIÓN 2: DATOS -->
  <nav>
    <h6 class="footer-title">Datos</h6>

    <p>
      <span class="font-semibold">Fecha:</span><br>
      {{ today() | date:'fullDate' }}
    </p>

    <p>
      <span class="font-semibold">Total:</span><br>
      {{ price() | currency }}
    </p>

    <p>
      <span class="font-semibold">Progreso:</span><br>
      {{ percent() | percent }}
    </p>
  </nav>

  <!-- SECCIÓN 3: NAVEGACIÓN -->
  <nav>
    <h6 class="footer-title">Navegación</h6>

    <a class="link link-hover" routerLink="/">Inicio</a>
    <a class="link link-hover" routerLink="/students">Estudiantes</a>
    <a class="link link-hover" routerLink="/layouts">Layouts</a>
    <a class="link link-hover" routerLink="/profile">Perfil</a>
  </nav>

</footer>
